name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable and this workflow
      # runs with a checkout of the repository it is testing.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # The suite never touches the network: every Jev response is a scripted stub, and the
      # two tests that exercise the failure path aim at a closed loopback port.
      - run: uv run --frozen pytest -q
        env:
          # Belt and braces — a stray key in the runner environment must not turn a stubbed
          # test into a real API call.
          TYPESAFE_API_KEY: ""
          JEV_ROUTER_KEY_FILE: /nonexistent
      # The evals read local files only and their tests use synthetic transcripts. They live
      # outside scripts/, so the coverage gate of the plugin runtime does not apply to them.
      # They run on the oldest Python the README promises.
      - run: uv run --frozen --python 3.10 pytest evals -q --no-cov
      # evals/ is outside the sync that scans the published runtime for personal paths.
      # git grep reads tracked files only, so the bytecode the test run just wrote (which
      # holds the runner's own paths) is not scanned.
      - run: "! git grep -n -e /Users/ -e /home/ -- evals"
