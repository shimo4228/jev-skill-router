[project]
name = "jev-skill-router"
version = "0.2.0"
description = "UserPromptSubmit hook for Claude Code that ranks the whole skill roster with two TypeSafe Jev requests and suggests at most one skill."
requires-python = ">=3.10"
# runtime は stdlib のみ。公開物として他人の環境でそのまま動くことが要件なので、
# 作者の harness 内部部品にも外部 package にも依存しない。
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-markers",
  "--cov=scripts",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する。無指定だと ruff の版更新でゲートの判定が
# 動く — 検査の閾値は harness 側が所有する (根拠は root ruff.toml の冒頭コメント)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.isort]
# Pin `scripts` as first-party, same as the root ruff.toml. Without it ruff decides by
# whether `scripts` happens to resolve from where the file sits, and `verify.sh --staged`
# explodes only the staged files into a temp tree — so the same file passes or fails
# depending on what else was staged. A gate that moves with the staging set is not a gate.
known-first-party = ["scripts"]

[tool.ruff.lint.per-file-ignores]
# テスト関数は消費される境界ではない。型強制は production 側のみ
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
